# MetaIoid Android — build configuration.
#
# Every version is pinned in gradle/libs.versions.toml. There are no dynamic
# ("+") versions and no snapshot repositories: a build of a given commit must
# produce the same artifact in six months.

# JVM: 3 GB is enough for Compose + R8 on the CI runner without starving the
# Kotlin daemon. Metaspace is capped so a long lint run cannot grow forever.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# Only :app needs BuildConfig (it carries the build's public configuration).
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=true
android.nonFinalResIds=false

kotlin.code.style=official
kotlin.incremental=true

# ── Non-secret build configuration ────────────────────────────────────────────
# These are PUBLIC identifiers only. Anything that must stay secret belongs on
# the gateway (server/.env) and is never referenced from this project.
#
# Leave the gateway URL empty to ship an APK that asks the user for their
# gateway on first run (the default, and what the published APK does). Set it —
# via -Pmetaloid.gatewayUrl=… , METALOID_GATEWAY_URL, or local.properties — to
# bake a default in for a specific deployment.
metaloid.gatewayUrl=
# Optional Supabase project (public URL + public anon key). When empty the app
# asks the gateway at /api/config, which serves exactly the same two public
# values, so an unconfigured build still connects to a Supabase-backed gateway.
metaloid.supabaseUrl=
metaloid.supabaseAnonKey=
